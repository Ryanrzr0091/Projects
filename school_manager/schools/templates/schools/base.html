<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}School Manager{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
        nav { background: #1a3a5c; color: white; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
        nav a { color: white; text-decoration: none; font-weight: 500; }
        nav a:hover { text-decoration: underline; }
        nav .brand { font-size: 1.2rem; font-weight: 700; }
        main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.6rem; margin-bottom: 1.5rem; color: #1a3a5c; }
        h2 { font-size: 1.2rem; margin: 1.5rem 0 0.75rem; color: #1a3a5c; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        th { background: #1a3a5c; color: white; text-align: left; padding: 0.75rem 1rem; font-weight: 500; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f0f4f8; }
        .btn { display: inline-block; padding: 0.5rem 1.1rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: #1a3a5c; color: white; }
        .btn-primary:hover { background: #14304e; }
        .btn-secondary { background: #e2e8f0; color: #333; }
        .btn-secondary:hover { background: #cbd5e1; }
        .btn-danger { background: #c0392b; color: white; }
        .btn-danger:hover { background: #a93226; }
        .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.82rem; }
        .actions { display: flex; gap: 0.5rem; align-items: center; }
        .card { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        .meta { color: #666; font-size: 0.9rem; margin-bottom: 0.4rem; }
        form label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
        form input, form select, form textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
        form input:focus, form select:focus, form textarea:focus { outline: 2px solid #1a3a5c; border-color: #1a3a5c; }
        .form-actions { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
        .breadcrumb { font-size: 0.88rem; color: #666; margin-bottom: 1.2rem; }
        .breadcrumb a { color: #1a3a5c; text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }
        .empty { color: #999; font-style: italic; padding: 1rem 0; }
        .delete-warning { background: #fff5f5; border: 1px solid #f5c6cb; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .delete-warning p { color: #721c24; margin-bottom: 1rem; }
    </style>
</head>
<body>
<nav>
    <span class="brand">School Manager</span>
    <a href="{% url 'school-list' %}">Schools</a>
</nav>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
